# ===================================================
# Configuration for Converted_BIK
# ===================================================
# Paths can be absolute or relative to repository root
# Empty lines and lines starting with # are ignored

[paths]
# RAD Game Tools (MP4 to BIK conversion)
radtools_new=third-party\Radtools_New\radvideo64.exe
# RAD Game Tools (WAV to BIK mixing)
radtools_old=third-party\Radtools_Old\BinkMix.exe
# MIX archive packing tool
ccmix=third-party\CCMIX\ccmix.exe
# FFmpeg (for H265.bat and MP3 to WAV conversion)
ffmpeg=third-party\ffmpeg.exe
# BIK preview player
binkplay=third-party\Radtools_New\binkplay.exe

[folders]
# Source MP4 videos
mp4_source=Clean_MP4
# WAV audio tracks
sound_source=WAV_Sound
# Original BIK files
clean_bik=Clean_BIK
# Conversion output
final_ra1=Final_BIK_RA1
final_ra2=Final_BIK_RA2
final_ra2yr=Final_BIK_RA2YR
# Packaging output
build_root=Build

[config]
# Log file
log_file=conversion_log.txt
# Failed files log
failed_file=failed.txt

[nolang]
# RA1 HD files (space-separated, go to nolang folder)
files_hd=ALLIESMAP_01 ALLIESMAP_02 ALLIESMAP_03 ALLIESMAP_04 ALLIESMAP_05 ALLIESMAP_06 ALLIESMAP_07 ALLIESMAP_08 ALLIESMAP_09 ALLIESMAP_10 ALLIESMAP_11 ALLIESMAP_12 ALLIESMAP_13 ALLIESMAP_14 RA_CREDITS REDINTRO RETALIATION_INTRO RETALIATION_WINA RETALIATION_WINS SOVIETMAP_01 SOVIETMAP_02 SOVIETMAP_03 SOVIETMAP_04 SOVIETMAP_05 SOVIETMAP_06 SOVIETMAP_07 SOVIETMAP_08 SOVIETMAP_09 SOVIETMAP_10 SOVIETMAP_11 SOVIETMAP_12 SOVIETMAP_13 SOVIETMAP_14
# RA1 noformat files (space-separated, go to nolang folder)
files_noformat=AFTRMATH AIRFIELD ALLYMORF ANTEND ANTINTRO APCESCPE ASSESS BATTLE BEACHEAD BINOC BMAP BOMBRUN BRDGTILT CRONFAIL CRONTEST DESTROYR DOUBLE DPTHCHRG DUD ELEVATOR EXECUTE FLARE FROZEN GRVESTNE LANDING MASASSLT MCV MCV_LAND MCVBRDGE MIG MONTPASS MOVINGIN MTNKFACT NUKESTOK OILDRUM ONTHPRWL PERISCOP RADRRAID SEARCH SFROZEN SHIPSINK SHORBOM1 SHORBOM2 SHORBOMB SITDUCK SLNTSRVC SNOWBASE SNOWBOMB SNSTRAFE SOVBATL SOVCEMET SOVMCV SOVTSTAR SPOTTER SPY STRAFE TAKE_OFF TESLA TOOFAR TRINITY V2ROCKET AAGUN
