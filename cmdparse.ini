# CMDParse configuration
# Values here are defaults — CLI arguments override them
# Paths are relative to config file location

[defaults]
# Default mode: cross, pack_mo, pack_original, mp3_to_wav
mode=cross

# Default games (comma-separated): RA1, RA2, RA2YR
games=RA1,RA2,RA2YR

# Default voice group filter (empty = all)
groups=

# Default resolution filter (empty = all)
resolutions=

# Mode flags
dry_run=false
incremental=false
retry=false
overwrite=false
